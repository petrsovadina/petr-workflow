<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">petr-workflow</title>
  <desc id="d">Plugin pro Claude Code a Claude aplikaci: spec, plán, implementace, review. Ukázka příkazů /pw-* v terminálu.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="18%" r="62%">
      <stop offset="0" stop-color="#D84BA4" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#7a2f88" stop-opacity=".12"/>
      <stop offset="1" stop-color="#16121a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="6%" cy="100%" r="45%">
      <stop offset="0" stop-color="#6b4fd8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#16121a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".06"/>
    </pattern>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3c6e3"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e05bb0" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#3a2f44"/>
      <stop offset="1" stop-color="#3a2f44"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
      .cur{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1280" height="640" rx="28" fill="#16121a"/>
  <rect width="1280" height="640" rx="28" fill="url(#dots)"/>
  <rect width="1280" height="640" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="640" rx="28" fill="url(#glow2)"/>

  <!-- left column -->
  <g class="sans">
    <text x="80" y="128" class="mono" font-size="15" letter-spacing="3" fill="#e05bb0">CLAUDE PLUGIN · OD PETRA SOVADINY</text>
    <text x="76" y="226" font-size="80" font-weight="800" letter-spacing="-2.5" fill="url(#title)">petr-workflow</text>
    <text x="80" y="290" font-size="27" font-weight="600" fill="#ffffff">Spec <tspan fill="#e05bb0">→</tspan> plán <tspan fill="#e05bb0">→</tspan> implementace <tspan fill="#e05bb0">→</tspan> review</text>
    <text x="80" y="334" font-size="20" fill="#c9bfd2">Pracovní metoda pro agentní vývoj.</text>
    <text x="80" y="362" font-size="20" fill="#c9bfd2">Malé kroky, minimální diff, rozhodnutí v ADR.</text>

    <!-- chips -->
    <g font-size="16" font-weight="600">
      <rect x="80" y="410" width="104" height="38" rx="19" fill="#D84BA4"/>
      <text x="132" y="435" text-anchor="middle" fill="#fff">7 skills</text>
      <rect x="196" y="410" width="146" height="38" rx="19" fill="none" stroke="#4a3f55" stroke-width="1.5"/>
      <text x="269" y="435" text-anchor="middle" fill="#ece6f0">Claude Code</text>
      <rect x="354" y="410" width="168" height="38" rx="19" fill="none" stroke="#4a3f55" stroke-width="1.5"/>
      <text x="438" y="435" text-anchor="middle" fill="#ece6f0">Claude aplikace</text>
      <rect x="80" y="460" width="134" height="38" rx="19" fill="none" stroke="#4a3f55" stroke-width="1.5"/>
      <text x="147" y="485" text-anchor="middle" fill="#ece6f0">Apache-2.0</text>
      <rect x="226" y="460" width="190" height="38" rx="19" fill="none" stroke="#4a3f55" stroke-width="1.5"/>
      <text x="321" y="485" text-anchor="middle" fill="#ece6f0">bez tokenů a dat</text>
    </g>
    <text x="80" y="566" class="mono" font-size="15" fill="#8d8299">github.com/petrsovadina/petr-workflow</text>
  </g>

  <!-- terminal -->
  <g filter="url(#shadow)">
    <rect x="688" y="104" width="516" height="432" rx="18" fill="#0f0c12"/>
  </g>
  <rect x="688.75" y="104.75" width="514.5" height="430.5" rx="17.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M688 150h516" stroke="#2a2431"/>
  <circle cx="714" cy="127" r="6" fill="#ff5f57"/><circle cx="734" cy="127" r="6" fill="#febc2e"/><circle cx="754" cy="127" r="6" fill="#28c840"/>
  <text x="946" y="132" text-anchor="middle" class="sans" font-size="14" fill="#8d8299">claude · ~/repo</text>

  <g class="mono" font-size="16.5" xml:space="preserve">
    <text x="714" y="192"><tspan fill="#e05bb0">›</tspan><tspan fill="#ffffff"> /pw-spec</tspan><tspan fill="#c9bfd2"> export pacientů do FHIR</tspan></text>
    <text x="714" y="220"><tspan fill="#3ddc97">✓</tspan><tspan fill="#ece6f0"> INITIAL.md</tspan><tspan fill="#8d8299">  cíle · AC · blokery</tspan></text>

    <text x="714" y="268"><tspan fill="#e05bb0">›</tspan><tspan fill="#ffffff"> /pw-plan</tspan></text>
    <text x="714" y="296"><tspan fill="#3ddc97">✓</tspan><tspan fill="#ece6f0"> PLAN.md</tspan><tspan fill="#8d8299">     3 fáze × max 4 kroky</tspan></text>

    <text x="714" y="344"><tspan fill="#e05bb0">›</tspan><tspan fill="#ffffff"> /pw-implement</tspan><tspan fill="#c9bfd2"> fáze 1</tspan></text>
    <text x="714" y="372"><tspan fill="#3ddc97">✓</tspan><tspan fill="#ece6f0"> diff</tspan><tspan fill="#3ddc97"> +42</tspan><tspan fill="#ff7a90"> −7</tspan><tspan fill="#8d8299">   testy prošly</tspan></text>

    <text x="714" y="420"><tspan fill="#e05bb0">›</tspan><tspan fill="#ffffff"> /pw-review</tspan></text>
    <text x="714" y="448"><tspan fill="#3ddc97">✓</tspan><tspan fill="#ece6f0"> 0 blockerů</tspan><tspan fill="#8d8299">  · 2 návrhy</tspan></text>

    <text x="714" y="500"><tspan fill="#e05bb0">›</tspan></text>
    <rect class="cur" x="732" y="486" width="10" height="19" fill="#e05bb0"/>
  </g>
</svg>
