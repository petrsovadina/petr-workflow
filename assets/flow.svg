<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="t d">
  <title id="t">Jak petr-workflow pracuje</title>
  <desc id="d">Čtyři kroky: /pw-spec vytvoří INITIAL.md, /pw-plan PLAN.md, /pw-implement jednu fázi s minimálním diffem, /pw-review nezávislé review. Po review další fáze. Kdykoli /pw-adr zapíše rozhodnutí, /pw-handoff předá práci další session.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#D84BA4" stop-opacity=".22"/>
      <stop offset="1" stop-color="#16121a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241d2b"/>
      <stop offset="1" stop-color="#1b1620"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e05bb0"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8d8299"/>
    </marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
      .flow{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-28}}
    </style>
  </defs>

  <rect width="1280" height="620" rx="24" fill="#16121a"/>
  <rect width="1280" height="620" rx="24" fill="url(#glow)"/>

  <g class="sans">
    <text x="64" y="74" class="mono" font-size="14" letter-spacing="3" fill="#e05bb0">JAK TO PRACUJE</text>
    <text x="64" y="112" font-size="32" font-weight="800" letter-spacing="-.5" fill="#ffffff">Od nápadu k mergi ve čtyřech příkazech</text>
  </g>

  <!-- connectors -->
  <g stroke="#e05bb0" stroke-width="2.5" fill="none">
    <path class="flow" d="M340 262H362" marker-end="url(#arr)"/>
    <path class="flow" d="M640 262H662" marker-end="url(#arr)"/>
    <path class="flow" d="M940 262H962" marker-end="url(#arr)"/>
  </g>
  <!-- loop: review -> implement -->
  <path d="M1100 380V412Q1100 428 1084 428H818Q802 428 802 412V386" stroke="#8d8299" stroke-width="2" fill="none" stroke-dasharray="5 6" marker-end="url(#arrm)"/>
  <rect x="884" y="414" width="138" height="28" rx="14" fill="#16121a"/>
  <text x="953" y="433" text-anchor="middle" class="sans" font-size="14" fill="#c9bfd2">další fáze</text>

  <!-- stage cards -->
  <g class="sans">
    <!-- 1 -->
    <rect x="64" y="148" width="276" height="232" rx="16" fill="url(#card)" stroke="#33293b"/>
    <rect x="84" y="148" width="236" height="3" rx="1.5" fill="#e05bb0"/>
    <text x="88" y="190" class="mono" font-size="14" fill="#8d8299">01</text>
    <text x="88" y="224" class="mono" font-size="24" font-weight="700" fill="#ffffff">/pw-spec</text>
    <text x="88" y="262" font-size="16" fill="#c9bfd2">Cíle, non-goals,</text>
    <text x="88" y="286" font-size="16" fill="#c9bfd2">akceptační kritéria, blokery.</text>
    <text x="88" y="310" font-size="16" fill="#c9bfd2">Ještě žádný kód.</text>
    <rect x="88" y="330" width="118" height="30" rx="8" fill="#2e2236"/>
    <text x="147" y="350" text-anchor="middle" class="mono" font-size="14" fill="#f3c6e3">INITIAL.md</text>

    <!-- 2 -->
    <rect x="364" y="148" width="276" height="232" rx="16" fill="url(#card)" stroke="#33293b"/>
    <rect x="384" y="148" width="236" height="3" rx="1.5" fill="#e05bb0"/>
    <text x="388" y="190" class="mono" font-size="14" fill="#8d8299">02</text>
    <text x="388" y="224" class="mono" font-size="24" font-weight="700" fill="#ffffff">/pw-plan</text>
    <text x="388" y="262" font-size="16" fill="#c9bfd2">Fáze po max 3–4 krocích,</text>
    <text x="388" y="286" font-size="16" fill="#c9bfd2">každá s ověřením.</text>
    <rect x="388" y="330" width="100" height="30" rx="8" fill="#2e2236"/>
    <text x="438" y="350" text-anchor="middle" class="mono" font-size="14" fill="#f3c6e3">PLAN.md</text>

    <!-- 3 -->
    <rect x="664" y="148" width="276" height="232" rx="16" fill="url(#card)" stroke="#33293b"/>
    <rect x="684" y="148" width="236" height="3" rx="1.5" fill="#e05bb0"/>
    <text x="688" y="190" class="mono" font-size="14" fill="#8d8299">03</text>
    <text x="688" y="224" class="mono" font-size="24" font-weight="700" fill="#ffffff">/pw-implement</text>
    <text x="688" y="262" font-size="16" fill="#c9bfd2">Jedna fáze, minimální diff,</text>
    <text x="688" y="286" font-size="16" fill="#c9bfd2">ověření testem nebo během.</text>
    <rect x="688" y="330" width="96" height="30" rx="8" fill="#2e2236"/>
    <text x="736" y="350" text-anchor="middle" class="mono" font-size="14"><tspan fill="#3ddc97">+diff</tspan><tspan fill="#ff7a90"> −</tspan></text>

    <!-- 4 -->
    <rect x="964" y="148" width="252" height="232" rx="16" fill="url(#card)" stroke="#33293b"/>
    <rect x="984" y="148" width="212" height="3" rx="1.5" fill="#e05bb0"/>
    <text x="988" y="190" class="mono" font-size="14" fill="#8d8299">04</text>
    <text x="988" y="224" class="mono" font-size="24" font-weight="700" fill="#ffffff">/pw-review</text>
    <text x="988" y="262" font-size="16" fill="#c9bfd2">Subagent bez kontextu</text>
    <text x="988" y="286" font-size="16" fill="#c9bfd2">implementace: vidí jen</text>
    <text x="988" y="310" font-size="16" fill="#c9bfd2">diff, spec a plán.</text>
    <rect x="988" y="330" width="90" height="30" rx="8" fill="#2e2236"/>
    <text x="1033" y="350" text-anchor="middle" class="mono" font-size="14" fill="#f3c6e3">nálezy</text>
  </g>

  <!-- side skills -->
  <g class="sans">
    <rect x="64" y="470" width="566" height="86" rx="16" fill="none" stroke="#4a3f55" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="88" y="506" class="mono" font-size="19" font-weight="700" fill="#ffffff">/pw-adr</text>
    <text x="88" y="534" font-size="15" fill="#c9bfd2">Kdykoli padne rozhodnutí s dlouhým dopadem.</text>
    <rect x="452" y="494" width="154" height="30" rx="8" fill="#2e2236"/>
    <text x="529" y="514" text-anchor="middle" class="mono" font-size="13" fill="#f3c6e3">docs/adr/ADR-NNN</text>

    <rect x="650" y="470" width="566" height="86" rx="16" fill="none" stroke="#4a3f55" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="674" y="506" class="mono" font-size="19" font-weight="700" fill="#ffffff">/pw-handoff</text>
    <text x="674" y="534" font-size="15" fill="#c9bfd2">Konec session: předání další session nebo agentovi.</text>
    <rect x="1080" y="494" width="112" height="30" rx="8" fill="#2e2236"/>
    <text x="1136" y="514" text-anchor="middle" class="mono" font-size="13" fill="#f3c6e3">HANDOFF.md</text>
  </g>

  <text x="640" y="592" text-anchor="middle" class="sans" font-size="14" fill="#8d8299">Na pozadí běží skill <tspan class="mono" fill="#c9bfd2">petr-workflow</tspan>: kontext před otázkami · spec před kódem · blokery explicitně</text>
</svg>
